name: financetracker
description: A finance tracker Flutter application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.1.1
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.2
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/card-bg-ortho.png
